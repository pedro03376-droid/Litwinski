name: Keep backend awake

# Mantém o backend grátis do Render "acordado": faz um ping leve no /health
# a cada 10 minutos, evitando que ele hiberne por inatividade (cold start).
# É gratuito (repositório público) e não precisa de conta em serviço externo.

on:
  schedule:
    - cron: '*/10 * * * *'   # a cada 10 minutos
  workflow_dispatch:          # permite disparar manualmente na aba Actions

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend health
        run: |
          echo "Pingando o backend…"
          code=$(curl -sS -m 60 -o /dev/null -w "%{http_code}" https://gkhub-backend.onrender.com/api/v1/health || echo "000")
          echo "HTTP $code"
          # Não falha o job em erro transitório (servidor acordando): apenas registra.
          exit 0
